[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paris-eda"
version = "0.8.0"
description = "PARIS design-specific timing prediction, candidate ranking and dataset automation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "PARIS contributors"}]
dependencies = ["numpy>=1.26,<3", "pandas>=2.0,<3", "pyarrow>=14", "PyYAML>=6", "scipy>=1.10", "scikit-learn>=1.3,<2", "xgboost>=2,<4", "joblib>=1.3"]

[project.optional-dependencies]
legacy = ["lightgbm>=4,<5"]
dev = ["pytest>=8", "build>=1", "ruff>=0.8"]

[project.scripts]
paris = "paris_tool.cli:main"

[project.entry-points."paris.algorithms"]
paris4 = "paris_tool.algorithms.paris4:Backend"
paris4-native = "paris_tool.algorithms.paris4:Backend"
paris-single-xgb = "paris_tool.algorithms.single_xgb:Backend"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paris_tool = ["resources/*.tcl", "resources/*.py", "resources/*.yaml", "resources/*.json", "resources/*.csv", "resources/ui/*"]
"paris_tool._features" = ["PROVENANCE.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

